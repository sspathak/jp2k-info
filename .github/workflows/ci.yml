name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (OpenJPEG)
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenjp2-7 libopenjp2-tools

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run unit tests
        run: |
          python -m unittest discover tests

      - name: Test CLI execution
        run: |
          chmod +x ./jp2k-info
          ./jp2k-info dump samples/lossless_5_3.jp2
          ./jp2k-info dump samples/lossy_9_7_multitile.jp2
          ./jp2k-info json samples/error_resilient.jp2
          ./jp2k-info markdown samples/multilayer_progressive.jp2
