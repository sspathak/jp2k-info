name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: latest
          cache: true

      - name: Run unit tests
        run: pixi run test

      - name: Test CLI execution
        run: |
          pixi run dump samples/lossless_5_3.jp2
          pixi run dump samples/lossy_9_7_multitile.jp2
          pixi run json samples/error_resilient.jp2
          pixi run markdown samples/multilayer_progressive.jp2
